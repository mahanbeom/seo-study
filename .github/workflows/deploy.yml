# GitHub Pages 배포.
#
# withastro/action 을 쓰지 않는다 — 그 액션은 아티팩트 업로드까지 내부에서 처리하므로
# dist 를 _site/<실험이름>/ 으로 옮길 지점이 없다. SPEC.md §4.3 의 "실험 = 폴더 = URL 경로"
# 구조에서는 이 이동이 필수이고, 실험이 늘어나면 _site 에 여러 빌드를 합쳐야 한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # 배포 지표 히스토리를 저장소에 다시 커밋하므로 write 가 필요하다.
  contents: write
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 지표 커밋을 origin/main 위로 rebase 하려면 얕은 클론이면 안 된다.
          fetch-depth: 0

      # 이 저장소는 실험별 하위 폴더 구조라 package.json 이 루트에 없다.
      # 명시하지 않으면 pnpm 버전을 결정하지 못해 실패한다.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: korean-food/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: korean-food/pnpm-lock.yaml

      - name: Install
        working-directory: korean-food
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: korean-food
        run: pnpm build

      # SPEC.md §5 — 완료 기준을 CI에서도 강제한다.
      # 검증에 실패한 산출물은 배포되지 않는다.
      - name: Verify SEO requirements
        working-directory: korean-food
        run: pnpm exec node scripts/verify-seo.mjs

      # 성능 회귀는 배포 순간에는 보이지 않는다. 배포마다 같은 조건으로 재서
      # docs/metrics 에 남겨두면 어느 커밋에서 무엇이 꺾였는지 되짚을 수 있다.
      # SEO·접근성이 기준선 미만이면 여기서 실패하고 배포되지 않는다.
      - name: Record deploy metrics
        working-directory: korean-food
        run: node scripts/collect-metrics.mjs

      - name: Commit metrics history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add korean-food/docs/metrics
          if git diff --cached --quiet; then
            echo "지표 변화 없음 — 커밋 생략"
            exit 0
          fi
          # 루프 걱정은 하지 않아도 된다 — 기본 GITHUB_TOKEN 으로 만든 push 이벤트는
          # 워크플로를 새로 트리거하지 않는다(GitHub 의 재귀 방지 동작).
          #
          # 커밋 메시지에 skip 마커를 넣지 않는다. 그 토큰은 메시지 **어디에 있든**
          # 동작하므로, 설명하려고 본문에 적기만 해도 배포가 조용히 건너뛰어진다.
          # 실제로 이 파이프라인을 도입한 커밋이 그 이유로 배포되지 않았다.
          git commit -m "chore(metrics): ${GITHUB_SHA::7} 배포 지표 기록"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Assemble site
        run: |
          mkdir -p _site
          cp site-root/index.html _site/index.html
          mv korean-food/dist _site/korean-food

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
