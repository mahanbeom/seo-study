locale: en

title: 'Korean Food: A Complete Guide for First-Timers (2026)'
description: >-
  What Korean food actually is: rice, fermented foods, and the shared side-dish table
  called banchan — plus 12 core dishes, spice levels, and how a meal is served.

h1: 'Korean Food: A Complete Guide for First-Timers'

lede: >-
  Korean food is the cuisine of the Korean Peninsula, built on rice, fermented foods
  such as kimchi and doenjang, and a shared table of small side dishes called banchan.
  A typical meal serves rice, soup, and three to twelve banchan simultaneously rather
  than in courses — a structure called bapsang.

