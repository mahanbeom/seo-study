sections:
  - id: what-makes-korean-food-distinct
    heading: What Makes Korean Food Distinct
    body:
      - >-
        Three things set Korean cooking apart from its neighbours in China and Japan:
        fermentation as a foundation rather than a garnish, a table where everything
        arrives at once, and a seasoning system built on three fermented pastes rather
        than on stocks or dashi.
      - >-
        The three pastes are collectively called jang. Ganjang is soy sauce, doenjang
        is a thick soybean paste, and gochujang is a red chili paste made from chili
        powder, glutinous rice, and fermented soybean. All three begin with meju —
        blocks of cooked soybeans left to ferment with wild microbes. Between them they
        supply most of the salt, depth, and heat in the cuisine, which is why Korean
        cooking tastes distinctly different from Chinese or Japanese food even when the
        ingredients overlap.
      - >-
        Kimchi is the best known result of the same instinct. It is not a single recipe
        but a method: vegetables salted, seasoned, and left to ferment. Napa cabbage
        kimchi is the default abroad, but Korean households also make kkakdugi from
        cubed radish, dongchimi as a cold, chili-free brine, and dozens of seasonal
        variants. In 2013 UNESCO inscribed kimjang — the communal late-autumn practice
        of making and sharing kimchi for the winter — on its Representative List of the
        Intangible Cultural Heritage of Humanity.
      - >-
        The third distinguishing trait is structural. Where a Western meal moves
        through courses and a Japanese meal often centres on a single composed plate, a
        Korean meal spreads across the table at once and is assembled bite by bite by
        the person eating it.

  - id: core-dishes
    heading: The Core Dishes
    render: dish-table
    body:
      - >-
        These twelve account for most of what you will meet first, whether at a Korean
        restaurant abroad or on a menu in Seoul. Spice is rated from 0 (no chili at
        all) to 4 (assertively hot). Names follow the Revised Romanization system used
        by Korea's National Institute of Korean Language; the pronunciation column is
        an approximation for English speakers.
      - >-
        Half of this list contains no chili whatsoever. That is not a curated
        selection — it reflects the actual balance of the everyday Korean repertoire.

    image:
      file: bibimbap
      alt: >-
        A bowl of beef bibimbap topped with a fried egg, cucumber, carrot, and
        mushroom, with a dish of gochujang beside it.
      caption: Bibimbap, served with gochujang on the side so you control the heat.
      credit:
        author: Andy Li
        license: CC0
        licenseUrl: https://creativecommons.org/publicdomain/zero/1.0/
        sourceUrl: https://commons.wikimedia.org/wiki/File:Beef_Bibimbap_-_SAERO_2025-11-06.jpg

  - id: how-a-korean-meal-is-served
    heading: How a Korean Meal Is Served
    body:
      - >-
        Everything arrives together. Rice and soup go in front of each person, and the
        banchan sit in the middle of the table to be shared. There is no first course
        and no dessert course in the Western sense; you move between rice, soup, and
        side dishes in whatever order you like, returning to each throughout the meal.
      - >-
        Traditional table settings are counted in cheop — the number of side dishes,
        not counting rice, soup, kimchi, and sauces. A three-cheop table was ordinary
        in most households. Twelve-cheop was reserved for the royal court. The counting
        system is largely historical now, but it explains why a modest Korean restaurant
        still brings four or five small plates you did not order.
      - >-
        Utensils come as a pair called sujeo: a long metal spoon and metal chopsticks.
        The spoon does the work for rice and soup, and the chopsticks handle the
        banchan. Unlike in Japan, the rice bowl stays on the table rather than being
        lifted to the mouth.
      - >-
        Stews are usually eaten straight from the communal pot in the middle of the
        table. Grilled meat is wrapped at the table in lettuce or perilla leaf with a
        dab of ssamjang, a mixture of doenjang and gochujang — a practice called ssam.
        Banchan are refilled free of charge at nearly every restaurant in Korea; asking
        for more is normal, not an imposition.

    image:
      file: banchan
      alt: >-
        Several shallow ceramic dishes of banchan side by side, with braised soy-glazed
        potatoes in the dish nearest the camera.
      caption: >-
        Banchan sit in the middle of the table and are shared throughout the meal.
        In Korea they are refilled free of charge.
      credit:
        author: egg (Hong, Yun Seon)
        license: CC BY 2.0
