locale: ko

title: '한식이란 무엇인가 — 처음 접하는 사람을 위한 완전 가이드'
description: >-
  한식이 실제로 무엇인지 정리했다. 쌀과 발효식품, 반찬이라는 공유 상차림을 축으로
  핵심 요리 12가지와 맵기, 그리고 한 끼가 차려지는 방식까지 다룬다.

h1: '한식이란 무엇인가 — 처음 접하는 사람을 위한 완전 가이드'

lede: >-
  한식은 쌀과, 김치·된장 같은 발효식품, 그리고 반찬이라 부르는 작은 곁들이 음식들을
  함께 나누는 상차림을 토대로 한 한반도의 음식이다. 한 끼는 코스로 나뉘어 나오지 않고
  밥과 국, 그리고 세 가지에서 열두 가지의 반찬이 한꺼번에 오른다. 이 구조를 밥상이라 부른다.

hero:
  file: bapsang-table
  alt: >-
    열 가지가 넘는 작은 반찬과 돌솥에 담긴 찌개, 구운 생선, 밥이 한꺼번에 차려진 한국의 밥상.
  caption: >-
    한식은 코스가 아니라 한꺼번에 차려진다. 밥과 찌개, 그리고 상을 채우는 반찬.
  credit:
    author: egg (Hong, Yun Seon)
    license: CC BY 2.0
    licenseUrl: https://creativecommons.org/licenses/by/2.0
    sourceUrl: https://commons.wikimedia.org/wiki/File:Korean_cuisine-Hanjeongsik-03.jpg

sections:
  - id: what-makes-korean-food-distinct
    heading: 한식을 구별짓는 것
    body:
      - >-
        한식을 이웃한 중국·일본 음식과 갈라놓는 것은 세 가지다. 발효를 곁들이가 아니라
        토대로 삼는다는 점, 모든 음식이 한꺼번에 오르는 상차림, 그리고 육수나 다시가 아니라
        세 가지 발효 장을 축으로 짜인 조미 체계다.
      - >-
        세 가지 발효 조미료를 묶어 장이라 부른다. 간장은 콩으로 담근 짠 액체 조미료이고,
        된장은 되직한 콩 장이며, 고추장은 여기에 고춧가루와 찹쌀을 더한 붉은 장이다.
        셋 모두 출발점은 메주로, 삶은 콩을 덩이로 빚어 자연의 균으로 띄운 것이다.
        음식의 짠맛과 깊이, 매운맛의 대부분이 여기서 나오기 때문에, 재료가 겹치더라도
        한식의 맛이 중국이나 일본 음식과 뚜렷이 다르게 느껴진다.
      - >-
        같은 발상에서 나온 가장 널리 알려진 결과가 김치다. 김치는 특정한 조리법이 아니라
        방법의 이름이다. 채소를 절이고 양념해 발효시키는 것을 가리킨다. 국외에서는
        배추김치가 기본이지만, 한국의 가정에서는 무를 깍둑 썬 깍두기, 고추를 쓰지 않는
        차가운 국물의 동치미를 비롯해 철마다 수십 가지를 담근다. 2013년 유네스코는
        늦가을에 이웃과 함께 겨울 김치를 담가 나누는 김장을 인류무형문화유산
        대표목록에 등재했다.
      - >-
        세 번째 차이는 구조에 있다. 서양의 한 끼가 코스를 따라 흐르고 일본의 한 끼가
        한 그릇으로 완성되는 쪽이라면, 한식의 한 끼는 상 전체에 한꺼번에 펼쳐지고
        먹는 사람이 한 입씩 스스로 조합해 나간다.

  - id: core-dishes
    heading: 핵심 요리 12가지
    render: dish-table
    body:
      - >-
        국외의 한식당에서든 서울의 차림표에서든 가장 먼저 마주치게 되는 것이 이 열두 가지다.
        맵기는 0(고추를 전혀 쓰지 않음)에서 4(뚜렷하게 매움)까지로 표시했다. 로마자 표기는
        국립국어원의 국어의 로마자 표기법을 따랐다.
      - >-
        이 목록의 절반은 고추가 전혀 들어가지 않는다. 맵지 않은 것을 골라 담은 것이 아니라,
        일상적인 한식 구성이 원래 그렇다.

    image:
      file: bibimbap
      alt: >-
        달걀프라이와 오이, 당근, 버섯을 올린 소고기 비빔밥 한 그릇과 곁에 놓인 고추장 종지.
      caption: 비빔밥. 고추장을 따로 내어 매운 정도를 먹는 사람이 정하게 한다.
      credit:
        author: Andy Li
        license: CC0
        licenseUrl: https://creativecommons.org/publicdomain/zero/1.0/
        sourceUrl: https://commons.wikimedia.org/wiki/File:Beef_Bibimbap_-_SAERO_2025-11-06.jpg

  - id: how-a-korean-meal-is-served
    heading: 한 끼가 차려지는 방식
    body:
      - >-
        모든 음식이 함께 나온다. 밥과 국은 각자의 앞에 놓이고, 반찬은 상 가운데에 두어
        함께 먹는다. 서양식의 전채나 후식 코스라는 것이 없고, 밥과 국과 반찬 사이를
        원하는 순서로 오가며 식사가 끝날 때까지 같은 그릇으로 되돌아간다.
      - >-
        전통적인 상차림은 첩으로 센다. 밥과 국, 김치, 장류를 뺀 반찬의 가짓수를 가리키는
        말이다. 여염집에서는 삼첩반상이 보통이었고, 십이첩은 궁중의 상이었다. 지금은
        대체로 역사 속의 셈법이지만, 소박한 한식당에서도 시키지 않은 접시가 네다섯 개
        따라 나오는 이유를 설명해 준다.
      - >-
        수저는 숟가락과 젓가락을 한 벌로 묶어 부르는 말이다. 긴 쇠숟가락이 밥과 국을 맡고,
        쇠젓가락이 반찬을 맡는다. 일본과 달리 밥그릇은 들지 않고 상에 둔 채로 먹는다.
      - >-
        찌개는 대개 상 가운데의 냄비에서 바로 떠먹는다. 구운 고기는 상에서 상추나 깻잎에
        올리고 된장과 고추장을 섞은 쌈장을 조금 얹어 싸 먹는데, 이것을 쌈이라 한다.
        반찬은 한국의 거의 모든 식당에서 무료로 더 준다. 더 달라고 하는 것은 무례가 아니라
        당연한 일로 받아들여진다.

    image:
      file: banchan
      alt: >-
        얕은 사기 접시에 나란히 담긴 여러 가지 반찬. 가장 앞쪽 그릇에는 간장에 조린 감자조림.
      caption: >-
        반찬은 상 가운데에 놓고 식사 내내 함께 먹는다. 한국에서는 무료로 더 준다.
      credit:
        author: egg (Hong, Yun Seon)
        license: CC BY 2.0
        licenseUrl: https://creativecommons.org/licenses/by/2.0
        sourceUrl: https://commons.wikimedia.org/wiki/File:Korean_cuisine-Banchan-09.jpg

  - id: is-korean-food-spicy
    heading: 한식은 매운가?
    body:
      - >-
        알려진 것만큼은 아니다. 고추는 한반도에 비교적 늦게 들어왔다. 한국 문헌에 처음
        보이는 것이 1614년이고, 고추장 담그는 법이 조리서에 실리는 것은 1700년대다.
        고전적인 조리 목록의 상당 부분은 고추가 부엌에 들어오기 전에 이미 완성되어 있었고,
        그 음식들은 지금도 그대로 먹는다.
      - >-
        매운맛이 나타날 때 그 출처는 두 가지다. 고추장은 발효시킨 장이라 달고 되직하며
        매운맛이 천천히 올라온다. 고춧가루는 말린 고추를 굵게 빻은 것으로 더 날카롭고
        즉각적이다. 간장이나 참기름, 오래 고은 소고기 육수를 토대로 한 음식에는 고추가
        전혀 들어가지 않는다. 불고기, 잡채, 갈비탕, 설렁탕, 삼계탕, 물냉면, 그리고 달걀과
        두부, 나물로 만든 반찬 대부분이 그렇다.
      - >-
        덜 맵게 먹고 싶다면 덜 맵게 해주세요라고 말하면 된다. 떡볶이와 대부분의 찌개에는
        통하지만, 매운맛 자체가 음식의 정의인 것들은 의미 있게 누그러뜨릴 수 없다.

  - id: what-koreans-actually-eat
    heading: 한국인이 실제로 먹는 것
    body:
      - >-
        식당의 한식과 집의 한식은 같지 않다. 평일 집밥은 대개 밥과 찌개나 국 하나, 김치,
        그리고 간단한 반찬 두어 가지다. 시금치나물, 콩자반, 멸치볶음, 달걀말이 같은 것들이
        오른다. 구운 고기와 상다리 휘어지는 상차림은 외식과 모임의 몫이다.
      - >-
        지역별 차이는 일정을 짜서 찾아갈 만큼 뚜렷하다. 전주는 비빔밥과 유난히 넉넉한
        반찬으로 알려져 있다. 부산과 남해안은 회와 생선찌개를 비롯한 해산물에 기댄다.
        제주는 흑돼지와 풍부한 해산물이 있다. 물냉면과 만두 같은 이북 음식은 한국전쟁으로
        남쪽에 내려온 이들과 함께 자리를 잡아 전국의 기본 음식이 되었다.
      - >-
        길거리 음식은 그 자체로 하나의 갈래이며 시장 골목과 대학가 주변에 몰려 있다.
        떡볶이, 흑설탕과 견과를 넣어 지진 호떡, 김밥, 튀김, 그리고 뜨거운 국물과 함께
        내는 어묵 꼬치 같은 것들이다.

  - id: where-to-start
    heading: 어디서부터 시작할까
    body:
      - >-
        처음이라면 불고기나 비빔밥을 시키면 된다. 둘 다 맵지 않고, 둘 다 한 그릇으로
        한 끼가 완성되며, 한국 밖의 거의 모든 한식 차림표에 올라 있다. 둘 이상이라면
        잡채를 한 접시 곁들이고, 나머지는 반찬이 채우게 두면 된다.
      - >-
        두 번째라면 찌개를 시도해 볼 만하다. 이 음식의 바탕이 되는 맛을 알고 싶다면
        된장찌개, 매운맛을 감당할 준비가 되었다면 순두부찌개다. 아니면 삼겹살이나 갈비를
        눈앞에서 구워 상추에 싸 먹는 한국식 구이를 예약해도 좋다.
      - >-
        마실 것으로는 소주가 기본 증류주이고 구운 고기와 어울린다. 막걸리는 뿌옇고 살짝
        탄산이 도는 쌀술로 대개 파전과 함께 낸다. 무료로, 흔히 차게 내는 보리차가
        술이 아닌 쪽의 기본 선택지다.

dishes:
  - name: 비빔밥
    korean: 비빔밥
    pronunciation: Bibimbap
    spice: 2
    note: 양념한 나물과 달걀, 고추장을 밥에 올려 상에서 비벼 먹는다. 돌솥비빔밥은 뜨거운 돌그릇에 나와 바닥이 눌어붙는다.
  - name: 불고기
    korean: 불고기
    pronunciation: Bulgogi
    spice: 0
    note: 얇게 썬 소고기를 간장과 배, 마늘, 참기름에 재워 구운 것. 배의 효소가 고기를 연하게 하고 단맛의 출처가 된다.
  - name: 삼겹살
    korean: 삼겹살
    pronunciation: Samgyeopsal
    spice: 0
    note: 양념하지 않은 돼지 뱃살을 상에서 구워 쌈장과 마늘, 밥과 함께 상추에 싸 먹는다.
  - name: 갈비
    korean: 갈비
    pronunciation: Galbi
    spice: 0
    note: 간장과 배로 만든 양념에 재운 갈빗대를 숯불에 굽는다. 한국식 구이 상차림의 가장 흔한 중심 요리다.
  - name: 잡채
    korean: 잡채
    pronunciation: Japchae
    spice: 0
    note: 고구마 전분으로 만든 당면을 채소와 참기름, 간장에 볶아 낸다. 따뜻하게도, 식은 채로도 먹는다.
  - name: 김치찌개
    korean: 김치찌개
    pronunciation: Kimchi-jjigae
    spice: 3
    note: 묵은 김치에 돼지고기나 참치, 두부를 넣고 끓인다. 그대로 먹기엔 너무 신 김치를 쓰는 것이 본래의 쓸모다.
  - name: 된장찌개
    korean: 된장찌개
    pronunciation: Doenjang-jjigae
    spice: 1
    note: 두부와 애호박, 버섯을 된장에 끓인 찌개. 한국 집밥에서 가장 일상적으로 오른다.
  - name: 순두부찌개
    korean: 순두부찌개
    pronunciation: Sundubu-jjigae
    spice: 3
    note: 순두부를 고추와 해물이나 돼지고기 육수에 끓인 것. 끓는 채로 나와 상에서 날달걀을 깨 넣는다.
  - name: 떡볶이
    korean: 떡볶이
    pronunciation: Tteokbokki
    spice: 3
    note: 가래떡을 달고 매운 고추장 양념에 조린다. 한국 길거리 음식을 대표하는 음식이다.
  - name: 냉면
    korean: 냉면
    pronunciation: Naengmyeon
    spice: 0
    note: 메밀로 뽑은 차가운 국수. 물냉면은 살얼음 낀 소고기 육수에 말고, 비빔냉면은 고추장 양념에 비벼 맵지 않은 음식이 아니다.
  - name: 삼계탕
    korean: 삼계탕
    pronunciation: Samgyetang
    spice: 0
    note: 어린 닭의 배에 찹쌀과 인삼, 마늘, 대추를 채워 맑게 끓인 탕. 한여름에 먹는 음식으로 자리 잡았다.
  - name: 해물파전
    korean: 해물파전
    pronunciation: Haemul-pajeon
    spice: 0
    note: 쪽파와 해산물을 도톰하게 부쳐 가장자리를 바삭하게 낸 전. 잘라서 나눠 먹고 대개 막걸리와 함께한다.

faq:
  - q: 한식은 모두 매운가?
    a: >-
      아니다. 고추장과 고춧가루가 널리 쓰이기는 하지만, 고추가 전혀 들어가지 않는 기본
      음식도 많다. 불고기, 잡채, 갈비탕, 설렁탕, 삼계탕, 물냉면, 그리고 달걀과 두부,
      나물로 만든 반찬 대부분이 그렇다. 고추가 한반도에 들어온 것은 1600년 무렵이고,
      고전적인 조리 목록의 상당 부분은 그보다 앞서 완성되었다.
  - q: 반찬이란 무엇인가?
    a: >-
      반찬은 한 끼에서 밥과 함께 내는 작은 곁들이 음식이다. 평일 집밥에는 보통 두세 가지가
      오르고, 식당에서는 네다섯 가지, 한정식 상차림에서는 스무 가지가 넘기도 한다.
      전채가 아니라는 점이 중요하다. 식사가 끝날 때까지 상에 남아 가운데에서 함께 먹으며,
      한국의 거의 모든 식당에서 무료로 더 준다.
  - q: 한식당에서 처음에는 무엇을 시키면 좋은가?
    a: >-
      불고기나 비빔밥이다. 둘 다 맵지 않고, 한 가지 구성 요소가 아니라 한 그릇으로 한 끼가
      완성되며, 한국 밖의 거의 모든 한식 차림표에 올라 있다. 여럿이 먹는다면 역시 고추가
      들어가지 않는 잡채를 한 접시 곁들이면 된다.
  - q: 김치는 무엇으로 만드는가?
    a: >-
      김치는 채소를 절이고 양념해 발효시킨 음식이다. 가장 흔한 것은 배추에 고춧가루와 마늘,
      생강, 파, 젓갈을 넣은 것이지만 지역과 계절에 따른 종류가 수백 가지에 이른다.
      깍두기는 무를 깍둑 썰어 담그고, 동치미는 고추를 전혀 쓰지 않는 차가운 국물 김치다.
  - q: 채식을 하는 사람도 한식을 먹을 수 있는가?
    a: >-
      먹을 수 있지만 물어봐야 한다. 잡채와 대부분의 나물 반찬, 고기를 넣지 않은 순두부,
      채소 비빔밥은 어렵지 않다. 문제는 눈에 보이지 않는 동물성 재료다. 김치에는 새우젓이나
      멸치젓이 들어가는 경우가 많고, 찌개 대부분은 멸치나 소고기 육수에서 출발한다.
      사찰음식은 계율상 완전한 채식이며 이를 전문으로 하는 식당이 있다.
  - q: 고추장과 된장, 간장은 어떻게 다른가?
    a: >-
      셋 모두 콩으로 만든 한국의 발효 조미료이며 묶어서 장이라 부른다. 간장은 묽고 짜다.
      된장은 되직한 콩 장으로 구수하고 진해 찌개의 바탕이 된다. 고추장은 같은 콩 토대에
      고춧가루와 찹쌀을 더한 것이라 달면서 천천히 매운맛이 올라온다.
  - q: 한식은 왜 코스가 아니라 한꺼번에 나오는가?
    a: >-
      먹는 사람이 스스로 조합해 먹도록 설계된 한 끼이기 때문이다. 밥과 국, 모든 반찬을
      상에 함께 올려 두어 한 입마다 다르게 어울릴 수 있게 한다. 이 구조를 밥상이라 한다.
      전통적인 상차림은 첩으로 셌는데, 밥과 국, 김치, 장류를 뺀 반찬의 가짓수를 말한다.
      여염집에서는 삼첩반상이 보통이었고 십이첩은 궁중의 상이었다.
  - q: 한국식 구이와 불고기는 어떻게 다른가?
    a: >-
      한국식 구이는 형식이고 불고기는 그 안의 한 가지 음식이다. 한국식 구이란 자기 상에서
      직접 고기를 구워 상추에 싸 먹는 방식을 가리키며 대개 삼겹살이나 갈비를 쓴다.
      불고기는 얇게 썬 소고기를 간장과 배, 참기름 양념에 재운 특정한 음식이고, 식당에서
      굽는 것만큼이나 집에서 팬에 볶는 경우도 많다.
  - q: 반찬은 무료인가?
    a: >-
      그렇다. 한국의 거의 모든 식당에서 반찬은 식사에 포함되고 더 달라고 해도 무료다.
      추가를 청하는 것은 무례가 아니라 으레 있는 일로 받아들여진다. 한국 밖에서는 사정이
      갈린다. 무료로 더 주는 곳도 많지만, 값나가는 반찬은 유료로 하거나 처음 한 번만
      내는 곳도 있다.

