locale: ja

title: '韓国料理とは？定番12品と家庭で作るための完全ガイド'
description:
  "韓国料理の骨組みを、ご飯・発酵食品・パンチャン（小皿のおかず）の3つから解説。定番12品の辛さ一覧、\
  日本の味噌や醤油との違い、家庭で作るためにそろえる調味料までまとめました。"

h1: '韓国料理とは？定番12品と家庭で作るための完全ガイド'

lede: "韓国料理とは、米と、キムチやテンジャン（味噌）などの発酵食品、そして「パンチャン」と呼ばれる\
  小皿のおかずを中心に組み立てられる朝鮮半島の料理です。日本の食卓と最も違うのは出し方で、\
  コースで順に運ばれるのではなく、ご飯・汁物・3〜12品のパンチャンが最初から同時に並びます。\
  この一式をパンサン（밥상）と呼びます。"

hero:
  file: bapsang-table
  alt: '十数種類の小皿のおかず、石鍋のチゲ、焼き魚、ご飯が一度に並べられた韓国の食卓。'
  caption: '韓国の食事はコースではなく一度に運ばれてくる。ご飯とチゲ、そして食卓いっぱいのパンチャン。'
  credit:
    author: egg (Hong, Yun Seon)
    license: CC BY 2.0
    licenseUrl: https://creativecommons.org/licenses/by/2.0
    sourceUrl: https://commons.wikimedia.org/wiki/File:Korean_cuisine-Hanjeongsik-03.jpg

sections:
  - id: what-makes-korean-food-distinct
    heading: 韓国料理を特徴づけている3つのこと
    body:
      - "韓国料理を中国料理や日本料理から分けているのは、次の3つです。発酵を添え物ではなく土台に\
        置いていること、料理が一度に食卓に並ぶこと、そして出汁ではなく3種類の発酵調味料で\
        味の骨格を作ることです。"
      - "3種類の発酵調味料はまとめてジャン（장）と呼ばれます。カンジャン（간장）は醤油、\
        テンジャン（된장）は大豆の味噌、コチュジャン（고추장）は唐辛子粉ともち米を加えた\
        赤い辛味噌です。3つとも出発点は同じで、煮た大豆を固めて自然の菌で発酵させたメジュ（메주）\
        から作られます。塩気も、コクも、辛さも大半がここから来るため、材料が日本と重なっていても\
        味の方向がはっきり違います。"
      - "キムチも同じ発想から生まれたものです。キムチは特定のレシピではなく方法の名前で、\
        野菜を塩でしめ、薬味をまぶし、発酵させたものを指します。日本で広く知られているのは\
        白菜キムチですが、韓国の家庭では大根を角切りにしたカクテギ（깍두기）、唐辛子を使わない\
        冷たい漬け汁のトンチミ（동치미）など、季節ごとの種類が数十あります。晩秋に家族や近所で\
        冬の分のキムチを漬けて分け合う習慣キムジャン（김장）は、2013年にユネスコ無形文化遺産に\
        登録されました。"
      - "3つめの違いは構造にあります。日本の食事が一汁三菜のように一人分の膳としてまとまるのに対し、\
        韓国の食事は食卓全体に一度に広がり、食べる人が自分で組み合わせながら食べ進めます。"

  - id: core-dishes
    heading: 定番の12品
    render: dish-table
    body:
      - "韓国料理店でも、韓国の街の食堂でも、最初に出会うのはたいていこの12品です。辛さは\
        0（唐辛子を使わない）から4（かなり辛い）で示しています。「料理」の列は日本で通用している\
        呼び方、「読み方」の列は韓国語での実際の発音です。プルコギのように両方が同じものもあれば、\
        ビビンバ（韓国語ではピビムパプ）のようにずれているものもあります。"
      - "12品のうち半分は唐辛子をまったく使いません。辛くないものを選んで並べたわけではなく、\
        普段の韓国料理の構成がもともとそうなっています。"

    image:
      file: bibimbap
      alt: '目玉焼き、きゅうり、にんじん、きのこがのった牛肉ビビンバの器と、脇に添えられたコチュジャン。'
      caption: ビビンバ。コチュジャンは別添えで出てくることが多く、辛さは自分で調整する。
      credit:
        author: Andy Li
        license: CC0
        licenseUrl: https://creativecommons.org/publicdomain/zero/1.0/
        sourceUrl: https://commons.wikimedia.org/wiki/File:Beef_Bibimbap_-_SAERO_2025-11-06.jpg

  - id: how-a-korean-meal-is-served
    heading: 韓国の食卓はどう出てくるか
    body:
      - "すべてが同時に出てきます。ご飯と汁物は一人ずつの前に置かれ、パンチャンは食卓の中央に\
        置いて全員で共有します。前菜もデザートのコースもなく、ご飯・汁物・おかずのあいだを\
        好きな順に行き来しながら、食事の最後まで同じ皿に戻り続けます。"
      - "伝統的な膳立てはチョプ（첩）という単位で数えます。ご飯・汁物・キムチ・たれを除いた\
        おかずの数のことで、一般の家庭では3チョプが普通、12チョプは王宮の膳でした。\
        今では歴史上の呼び方ですが、韓国の小さな食堂でも注文していない小皿が4つ5つ出てくる\
        理由はここにあります。"
      - "箸とスプーンはスジョ（수저）という一組で扱います。長い金属のスプーンでご飯と汁物を食べ、\
        金属の箸でパンチャンをつまみます。日本と違い、ご飯茶碗は持ち上げず食卓に置いたまま\
        スプーンで食べます。"
      - "チゲは食卓中央の鍋から直接すくって食べるのが普通です。焼いた肉はサンチュやエゴマの葉に\
        包み、テンジャンとコチュジャンを合わせたサムジャン（쌈장）を少しのせて食べます。これを\
        サム（쌈）と呼びます。パンチャンは韓国のほぼすべての飲食店で無料のおかわりができ、\
        頼むことは失礼ではなく当たり前とされています。"

    image:
      file: banchan
      alt: '浅い陶器の小皿に盛りつけられた数種類のパンチャン。手前は醤油で甘辛く煮たじゃがいも。'
      caption: 'パンチャンは食卓の中央に置かれ、食事のあいだずっと共有される。韓国では無料でおかわりできる。'
      credit:
        author: egg (Hong, Yun Seon)
        license: CC BY 2.0
        licenseUrl: https://creativecommons.org/licenses/by/2.0
        sourceUrl: https://commons.wikimedia.org/wiki/File:Korean_cuisine-Banchan-09.jpg

  - id: is-korean-food-spicy
    heading: 韓国料理は辛いのか？
    body:
      - "評判ほどではありません。唐辛子が朝鮮半島に入ったのは比較的新しく、韓国の文献に最初に\
        現れるのは1614年、コチュジャンの作り方が料理書に載るのは1700年代です。古典的な献立の\
        かなりの部分は唐辛子が台所に来る前に完成しており、それらは今もそのまま食べられています。"
      - "辛さが出るときの出どころは2つです。コチュジャンは発酵させた辛味噌で、甘みがあり辛さが\
        ゆっくり来ます。コチュカル（고춧가루）は粗挽きの唐辛子粉で、こちらは輪郭がはっきりした\
        辛さです。日本の一味唐辛子より粗く、辛さそのものは穏やかで甘みと香りが強いため、\
        置き換えると味が変わります。醤油・ごま油・牛肉のだしを土台にした料理には唐辛子が\
        まったく入りません。プルコギ、チャプチェ、カルビタン、ソルロンタン、サムゲタン、\
        水冷麺、そして卵・豆腐・ナムル系のパンチャンの多くがこれにあたります。"
      - "辛さを抑えてほしいときは「トル メプケ ヘジュセヨ（덜 맵게 해주세요）」と伝えます。\
        トッポッキやたいていのチゲには通じますが、辛さそのものが料理の定義になっているものは\
        意味のある範囲で弱めることができません。"

  - id: what-koreans-actually-eat
    heading: 韓国の人が普段食べているもの
    body:
      - "店で出る韓国料理と、家で食べる韓国料理は別物です。平日の家庭の食事はご飯、チゲか\
        スープが1つ、キムチ、それに簡単なパンチャンが2〜3品というのが普通で、ほうれん草のナムル、\
        豆の煮物、じゃこ炒め、卵焼きといったものが並びます。焼肉や品数の多い膳は外食と\
        集まりのためのものです。"
      - "地方ごとの違いは旅行の予定を組む価値があるくらいはっきりしています。全州（チョンジュ）は\
        ビビンバと、パンチャンの数が多いことで知られます。釜山と南海岸は刺身や魚のチゲなど\
        海産物が中心です。済州島は黒豚と魚介です。水冷麺やマンドゥのような北の料理は、\
        朝鮮戦争で南に移った人たちとともに広がり、今では全国的な定番になりました。"
      - "屋台の食べ物は独立したジャンルで、市場の路地や大学の周辺に集まっています。トッポッキ、\
        黒砂糖とナッツを包んで焼くホットク、キンパ、トゥイギム（野菜や海産物の天ぷら）、\
        温かいスープと一緒に出される練り物の串オムク（어묵）などです。"

  - id: where-to-start
    heading: 家で作るなら、何からそろえるか
    body:
      - "韓国料理を家で作り始めるのに必要な調味料は5つです。カンジャン（醤油）、テンジャン（味噌）、\
        コチュジャン（辛味噌）、コチュカル（粗挽き唐辛子）、そしてごま油。この5つがあれば\
        以下の料理はほぼ作れます。日本の味噌と醤油で代用したくなりますが、テンジャンは\
        麹を使わず大豆だけを自然発酵させるため香りと塩気の出方が違い、置き換えると別の料理に\
        なります。最初の1回だけでも韓国産を使うと基準がつかめます。"
      - "作る順番としては、テンジャンチゲから始めるのが早道です。材料は豆腐・ズッキーニ・\
        きのこ・テンジャンだけで、韓国の家庭料理の味の土台がそのまま出ます。次にチャプチェ\
        （春雨と野菜の炒め物、辛くない）、その次にプルコギ（醤油・梨・にんにく・ごま油の\
        漬けだれ）へ進むと、甘味・塩気・ごま油の配分の感覚がつかめます。辛い料理はそのあとで\
        十分です。"
      - "材料で迷いやすいのは春雨とだしです。チャプチェに使うのはサツマイモでんぷんの\
        タンミョン（당면）で、緑豆春雨とは太さも歯ごたえも違います。チゲのだしは煮干しか\
        牛肉が基本で、かつおだしを使うと日本の汁物の味に寄ってしまいます。飲み物を合わせるなら、\
        焼肉には焼酎（ソジュ）、チヂミにはマッコリが定番の組み合わせです。"

dishes:
  - name: ビビンバ
    korean: 비빔밥
    pronunciation: ピビムパプ
    spice: 2
    note: 味付けした野菜、卵、コチュジャンをご飯にのせ、食卓で混ぜて食べる。トルソットビビンバは熱した石鍋で出てきて、底のご飯が香ばしく焦げる。
  - name: プルコギ
    korean: 불고기
    pronunciation: プルゴギ
    spice: 0
    note: 薄切りの牛肉を醤油・梨・にんにく・ごま油のたれに漬けて焼いたもの。梨の酵素が肉をやわらかくし、甘みの出どころにもなっている。
  - name: サムギョプサル
    korean: 삼겹살
    pronunciation: サムギョプサル
    spice: 0
    note: 味付けしない豚バラ肉を食卓で焼き、サンチュにサムジャン・にんにく・ご飯と一緒に包んで食べる。
  - name: カルビ
    korean: 갈비
    pronunciation: カルビ
    spice: 0
    note: 骨付きあばら肉を醤油と梨のたれに漬け、炭火で焼く。韓国式焼肉の中心になることが最も多い一品。
  - name: チャプチェ
    korean: 잡채
    pronunciation: チャプチェ
    spice: 0
    note: サツマイモでんぷんの春雨タンミョンを野菜・ごま油・醤油で炒めたもの。温かくても冷めていてもおいしい。
  - name: キムチチゲ
    korean: 김치찌개
    pronunciation: キムチチゲ
    spice: 3
    note: 酸味の出た古いキムチを豚肉かツナ、豆腐と煮込む。そのまま食べるには酸っぱすぎるキムチを使うのが本来の目的。
  - name: テンジャンチゲ
    korean: 된장찌개
    pronunciation: テンジャンチゲ
    spice: 1
    note: 豆腐・ズッキーニ・きのこをテンジャンで煮た汁物。韓国の家庭でいちばん日常的に作られる。
  - name: スンドゥブチゲ
    korean: 순두부찌개
    pronunciation: スンドゥブチゲ
    spice: 3
    note: おぼろ豆腐を唐辛子と海産物か豚肉のだしで煮たもの。煮立った状態で運ばれ、卓上で生卵を落とす。
  - name: トッポッキ
    korean: 떡볶이
    pronunciation: ットクポッキ
    spice: 3
    note: 棒状の餅をコチュジャンの甘辛いたれで煮からめる。韓国の屋台を代表する食べ物。
  - name: 冷麺
    korean: 냉면
    pronunciation: ネンミョン
    spice: 0
    note: そば粉を使った冷たい麺。ムルレンミョンは冷たい牛肉だしに入り、ビビムネンミョンは辛いたれで和えるので辛くない料理ではない。
  - name: サムゲタン
    korean: 삼계탕
    pronunciation: サムゲタン
    spice: 0
    note: 若鶏の腹にもち米・高麗人参・にんにく・なつめを詰めて煮込んだ澄んだスープ。真夏に食べる料理として定着している。
  - name: ヘムルパジョン
    korean: 해물파전
    pronunciation: ヘムルパジョン
    spice: 0
    note: 青ねぎと魚介を厚めに焼き上げ、縁を香ばしくしたチヂミ。切り分けて分け合い、マッコリと合わせることが多い。

faq:
  - q: 韓国料理はすべて辛いのですか？
    a: "いいえ。コチュジャン（発酵させた辛味噌）とコチュカル（粗挽き唐辛子）は広く使われますが、\
      唐辛子をまったく使わない定番も多くあります。プルコギ、チャプチェ、カルビタン、ソルロンタン、\
      サムゲタン、水冷麺、卵・豆腐・ナムル系のパンチャンの大半がそれにあたります。唐辛子が\
      朝鮮半島に入ったのは1600年前後で、古典的な献立のかなりの部分はそれ以前に完成しています。"
  - q: パンチャン（반찬）とは何ですか？
    a: "パンチャンは、韓国の食事でご飯と一緒に出される小皿のおかずのことです。平日の家庭では\
      2〜3品、飲食店では4〜6品、韓定食のような正式な膳では20品を超えることもあります。前菜では\
      ないという点が重要で、食事のあいだずっと食卓の中央に置かれ、全員で共有します。韓国の\
      ほぼすべての飲食店で無料のおかわりができます。"
  - q: 韓国料理を家で作るには、まず何をそろえればいいですか？
    a:
      "カンジャン（醤油）、テンジャン（味噌）、コチュジャン（辛味噌）、コチュカル（粗挽き唐辛子）、\
      ごま油の5つです。最初に作る料理はテンジャンチゲが向いています。材料が豆腐・ズッキーニ・\
      きのこ・テンジャンだけで、韓国の家庭料理の味の土台がそのまま出るからです。日本の味噌で\
      代用すると別の料理になります。テンジャンは麹を使わず大豆だけを自然発酵させるため、\
      香りと塩気の出方が違います。"
  - q: キムチは何から作られていますか？
    a: "キムチは、野菜を塩でしめ、薬味をまぶして発酵させたものです。いちばん一般的なのは白菜に\
      コチュカル・にんにく・しょうが・青ねぎ・塩辛を合わせたものですが、地域と季節ごとの種類が\
      数百あります。カクテギは大根を角切りにしたもの、トンチミは唐辛子をまったく使わない\
      冷たい漬け汁のキムチです。"
  - q: ベジタリアンでも韓国料理を食べられますか？
    a: "食べられますが、確認は必要です。チャプチェ、ナムル系のパンチャンの多く、肉を入れない\
      スンドゥブ、野菜ビビンバは問題ありません。難しいのは見えない動物性の材料で、キムチには\
      アミの塩辛やいわしの塩辛が入ることが多く、チゲのだしも煮干しか牛肉から取るのが普通です。\
      寺の精進料理サチャルウムシク（사찰음식）は戒律として完全に植物性で、専門の店もあります。"
  - q: コチュジャン・テンジャン・カンジャンは、日本の味噌や醤油とどう違いますか？
    a: "3つとも大豆から作る韓国の発酵調味料で、まとめてジャン（장）と呼ばれます。カンジャンは\
      醤油、テンジャンは大豆の味噌、コチュジャンはそこに唐辛子粉ともち米を加えた赤い辛味噌です。\
      日本の味噌との最大の違いは麹を使わない点で、テンジャンは煮た大豆を固めたメジュを自然の菌で\
      発酵させるため、甘みが少なく塩気と大豆の香りが強く出ます。日本の醤油より\
      カンジャンのほうが色が薄く塩気が立つ種類（クッカンジャン）もあり、汁物の味付けに使われます。"
  - q: なぜ韓国料理はコースではなく一度に並ぶのですか？
    a: "食べる人が自分で組み合わせて食べることを前提にした構成だからです。ご飯・汁物・すべての\
      おかずを最初から食卓に置くことで、一口ごとに違う組み合わせが作れます。この一式をパンサン\
      （밥상）と呼びます。伝統的な膳立てはチョプ（첩）で数え、ご飯・汁物・キムチ・たれを除いた\
      おかずの数を指します。一般家庭は3チョプ、12チョプは王宮の膳でした。"
  - q: 日本で「チヂミ」と呼ばれる料理は、韓国では何と呼びますか？
    a: "韓国では一般にジョン（전）、日常的にはプチムゲ（부침개）と呼びます。「チヂミ」は慶尚道の\
      方言チヂム（지짐）が日本で定着したもので、韓国の標準的な呼び方ではありません。青ねぎと\
      魚介で焼いたものはヘムルパジョン（해물파전）のように具材の名前を頭に付けて呼び分けます。\
      マッコリと合わせるのが定番の組み合わせです。"
  - q: 韓国では、おかず（パンチャン）は無料ですか？
    a: "はい。韓国国内の飲食店ではほぼ例外なく食事に含まれており、おかわりも無料です。追加を\
      頼むことは失礼ではなく、当たり前のことと受け取られます。韓国国外では扱いが分かれ、\
      無料でおかわりできる店も多い一方、上位の品を有料にしたり最初の一皿だけに限る店もあります。"

